services:
  - type: web
    name: smart-bundle-ai-api
    runtime: node
    buildCommand: npm ci && npm run build:api
    startCommand: npm start --workspace=@sba/api
    healthCheckPath: /health
    envVars:
      - key: ECOMMERCE_PROVIDER
        value: lenaldi
      - key: LENALDI_CACHE_TTL_SECONDS
        value: 900
      - key: GEMINI_API_KEY
        sync: false
      - key: LENALDI_WHATSAPP_NUMBER
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
